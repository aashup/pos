version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=zazzy_pos
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - APP_ENV=app
      - APP_DEBUG=true
      - APP_KEY=base64:abcdefghijklmnopqrstuvwxyzabcdefghijklmno=
    depends_on:
      - mysql
    networks:
      - zazzy
    command: sh -c "composer install && php artisan migrate:fresh --seed && php artisan serve --host=0.0.0.0 --port=8000"

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=zazzy_pos
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - zazzy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

volumes:
  mysql_data:

networks:
  zazzy:
    driver: bridge
