name: pos

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api
    ports:
      - "8001:8000"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    environment:
      XDEBUG_MODE: develop,debug
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - zazzy
    command: sh -c "composer install --no-interaction && php artisan serve --host=0.0.0.0 --port=8000"

  db:
    image: mysql:9.6
    container_name: db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pos
      MYSQL_ROOT_PASSWORD: tiger
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ptiger"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:

networks:
  zazzy:
    driver: bridge
